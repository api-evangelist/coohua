name: coohua
description: >-
  Coohua (酷划在线) is a Beijing-based Chinese mobile advertising company founded in 2014 and
  backed by Qiming Venture Partners. It pioneered the incentive- and lock-screen-advertising model
  in China, rewarding users with cash for unlocking their screens, reading content, and engaging
  with ads. Its flagship products include Coohua Lockscreen (酷划锁屏) and the Tao News (淘新闻)
  reading-rewards app, serving advertisers across internet, finance, automotive, and e-commerce
  verticals. At its peak Coohua captured a majority share of China's lock-screen advertising market
  and returned billions of yuan in cash rewards to users annually. No public API, developer portal,
  SDK, or machine-readable specification could be found during enrichment; advertising business is
  transacted through a sales contact (sale@coohua.com) on the 广告合作 page rather than through any
  self-serve or programmatic surface. The company does maintain a GitHub organization
  (github.com/coohua-dev) publishing CocoaPods spec repositories for the iOS modules behind its two
  apps, but every podspec resolves its source to an unreachable internal gitlab.coohua.com host, so
  none of it is consumable by a third party. This profile is retained as a company/provider record
  surfaced from the Qiming portfolio.

note: >-
  No Coohua package exists on npm, PyPI, RubyGems, crates.io, Maven Central, NuGet or
  pkg.go.dev — all were queried unauthenticated and returned zero results / HTTP 404 for
  "coohua". What Coohua does publish is a first-party CocoaPods *private spec repository*
  on its own GitHub organization (github.com/coohua-dev), holding podspecs for the iOS
  modules behind Coohua Lockscreen (酷划锁屏) and Tao News / NewsEarn (淘新闻). Ownership is
  confirmed from inside the podspecs themselves: authors are @coohua.com addresses
  (zhoucheng@coohua.com) and every `s.source` git URL points at gitlab.coohua.com.
  IMPORTANT — these are internal application modules, not consumer-facing API client
  SDKs, and they are NOT installable by a third party: the podspecs resolve their source
  to https://gitlab.coohua.com/..., a host that resolves in DNS (121.42.171.64) but
  refuses connections from the public internet. The spec repo is public; the code it
  points at is not. For that reason no `SDKs` pointer is emitted in apis.yml — Coohua
  ships no client library for any API, and crediting one would misstate the company's
  developer surface.
